name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
          for f in *.lua; do
            luajit -bl "$f" > /dev/null
          done

      - name: Package plugin
        run: |
          mkdir -p dist/ko-abs.koplugin
          cp _meta.lua main.lua abs_client.lua README.md dist/ko-abs.koplugin/
          cd dist && zip -r ../ko-abs.koplugin.zip ko-abs.koplugin

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ko-abs.koplugin.zip --generate-notes
